name: Sync achievement badges

on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency: sync-achievement-badges

defaults:
  run:
    shell: bash

jobs:
  sync:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Download missing badges
        run: python3 scripts/sync_badges.py

      - name: Commit and push new badges
        run: |
          git add -- c_images/album1584
          if git diff --cached --quiet; then
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Add missing achievement badges'
          git push origin "HEAD:${GITHUB_REF}"

      - name: Release new badges
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! previous=$(git describe --tags --match 'badges-*' --abbrev=0); then
            previous=$(git rev-list --first-parent --max-parents=0 HEAD)
          fi

          badges=$(git diff --no-renames --diff-filter=A --name-only "$previous" HEAD -- 'c_images/album1584/ACH_*.gif')
          if [[ -z "$badges" ]]; then
            exit 0
          fi

          notes="$RUNNER_TEMP/badge-release-notes.md"
          {
            printf '## New achievement badges\n\n'
            while IFS= read -r path; do
              printf -- '- `%s`\n' "${path##*/}"
            done <<< "$badges"
          } > "$notes"

          gh release create "badges-$(git rev-parse --short=12 HEAD)" \
            --target "$(git rev-parse HEAD)" \
            --title "Achievement badges ($(date -u +%F))" \
            --notes-file "$notes"
